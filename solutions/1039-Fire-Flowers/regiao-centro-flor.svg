<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 500"
  role="img"
  aria-labelledby="titulo descricao"
>
  <title id="titulo">Região permitida para o centro da flor</title>

  <desc id="descricao">
    Representação do círculo do caçador, da região permitida para o centro
    da flor e de uma flor completamente contida.
  </desc>

  <style>
    text {
      font-family: Arial, sans-serif;
      fill: #1f2937;
    }

    .titulo {
      font-size: 22px;
      font-weight: bold;
    }

    .rotulo {
      font-size: 16px;
    }

    .formula {
      font-size: 18px;
      font-weight: bold;
    }

    @media (prefers-color-scheme: dark) {
      text {
        fill: #e5e7eb;
      }
    }
  </style>

  <!-- Título -->
  <text x="400" y="35" text-anchor="middle" class="titulo">
    Região permitida para o centro da flor
  </text>

  <!-- Círculo do caçador -->
  <circle
    cx="300"
    cy="260"
    r="200"
    fill="#38bdf8"
    fill-opacity="0.10"
    stroke="#0284c7"
    stroke-width="4"
  />

  <!-- Região permitida para o centro da flor -->
  <circle
    cx="300"
    cy="260"
    r="140"
    fill="#facc15"
    fill-opacity="0.14"
    stroke="#ca8a04"
    stroke-width="3"
    stroke-dasharray="10 8"
  />

  <!-- Exemplo de flor no limite permitido -->
  <circle
    cx="440"
    cy="260"
    r="60"
    fill="#f87171"
    fill-opacity="0.30"
    stroke="#dc2626"
    stroke-width="4"
  />

  <!-- Centro do círculo do caçador -->
  <circle cx="300" cy="260" r="6" fill="#0284c7" />

  <!-- Centro da flor -->
  <circle cx="440" cy="260" r="6" fill="#dc2626" />

  <!-- Distância entre os centros -->
  <line
    x1="300"
    y1="260"
    x2="440"
    y2="260"
    stroke="#374151"
    stroke-width="3"
  />

  <!-- Indicação do raio da flor -->
  <line
    x1="440"
    y1="260"
    x2="500"
    y2="260"
    stroke="#dc2626"
    stroke-width="3"
  />

  <!-- Rótulos dos centros -->
  <text x="285" y="250" text-anchor="end" class="rotulo">
    H
  </text>

  <text x="445" y="250" class="rotulo">
    F
  </text>

  <!-- Rótulos dos círculos -->
  <text x="300" y="82" text-anchor="middle" class="rotulo">
    Círculo do caçador — raio R_H
  </text>

  <text x="300" y="135" text-anchor="middle" class="rotulo">
    Região permitida — raio R_H − R_F
  </text>

  <text x="440" y="350" text-anchor="middle" class="rotulo">
    Flor — raio R_F
  </text>

  <!-- Fórmula -->
  <text x="400" y="475" text-anchor="middle" class="formula">
    distância(H,F) ≤ R_H − R_F
  </text>
</svg>